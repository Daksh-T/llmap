<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Locating Legacies Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-theme="dark">
    <div class="grain"></div>

    <div class="app">

      <!-- ── Topbar ─────────────────────────────────────── -->
      <header class="topbar">
        <div class="topbar-brand">
          <div class="brand-pip"></div>
          <div>
            <span class="brand-title">Locating Legacies Atlas</span>
            <span class="brand-sub">
              An interface over
              <a href="https://locatinglegacies.org" target="_blank" rel="noreferrer" class="brand-link">locatinglegacies.org</a>
            </span>
          </div>
        </div>

        <div class="topbar-controls">
          <label class="search-wrap">
            <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l3.5 3.5" stroke-linecap="round"/></svg>
            <input id="search-input" class="topbar-input" type="search" placeholder="Search memorials, places, people&hellip;" autocomplete="off" />
          </label>
          <select id="type-filter" class="topbar-select">
            <option value="all">All types</option>
          </select>
          <div class="theme-toggle" role="group" aria-label="Color theme">
            <button class="theme-btn is-active" id="theme-dark-btn" data-theme-value="dark" type="button" aria-pressed="true">Dark</button>
            <button class="theme-btn" id="theme-light-btn" data-theme-value="light" type="button" aria-pressed="false">Light</button>
          </div>
        </div>

        <div class="topbar-stats">
          <button class="stat-btn" id="mapped-btn" title="Browse all memorials">
            <span class="stat-val" id="mapped-count">&mdash;</span>
            <span class="stat-key">mapped</span>
          </button>
          <div class="stat-rule"></div>
          <button class="stat-btn" id="inst-btn" title="Browse institutions">
            <span class="stat-val" id="institution-count">&mdash;</span>
            <span class="stat-key">institutions</span>
          </button>
          <span class="stat-time" id="fetched-at">Fetching&hellip;</span>
        </div>
      </header>

      <!-- ── Workspace ──────────────────────────────────── -->
      <div class="workspace">

        <!-- LEFT: Ledger index -->
        <nav class="ledger" aria-label="Memorial index">
          <div class="ledger-cap">
            <span class="ledger-heading">Index</span>
            <span class="ledger-count" id="results-note">&hellip;</span>
          </div>
          <div id="results-list" class="ledger-scroll"></div>
        </nav>

        <!-- CENTER: Map -->
        <main class="cartograph">
          <div id="map" class="map-canvas" aria-label="Interactive map of memorial records"></div>
        </main>

        <!-- RIGHT: Dossier (resizable, record only) -->
        <aside class="dossier" id="dossier">
          <div class="dossier-handle" id="dossier-handle" title="Drag to resize"></div>
          <div class="dossier-scroll">
            <div id="feature-card" class="record-view">
              <div class="record-empty">
                <span class="record-empty-glyph">&#9670;</span>
                <p>Select a memorial to examine its archival record.</p>
              </div>
            </div>
          </div>
        </aside>

      </div>
    </div>

    <!-- ── Full-page artifact catalog ───────────────────── -->
    <div id="catalog" class="catalog" role="dialog" aria-label="All memorials" hidden>
      <header class="catalog-head">
        <div class="catalog-brand">
          <h2 class="catalog-title">All Mapped Memorials</h2>
          <span class="catalog-count" id="catalog-count"></span>
        </div>
        <label class="catalog-search-wrap">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l3.5 3.5" stroke-linecap="round"/></svg>
          <input id="catalog-search" class="catalog-search" type="search" placeholder="Search all memorials&hellip;" autocomplete="off" />
        </label>
        <button class="catalog-close" id="catalog-close">&larr; Back to atlas</button>
      </header>
      <div id="catalog-grid" class="catalog-grid"></div>
    </div>

    <!-- ── Institutions slide-over ──────────────────────── -->
    <div id="inst-modal" class="overlay" role="dialog" aria-label="Institutions" hidden>
      <div class="overlay-backdrop" id="inst-backdrop"></div>
      <div class="overlay-panel">
        <div class="overlay-head">
          <h2 class="overlay-title">Institutions</h2>
          <p class="overlay-sub">Click to filter the atlas &middot; &nearr; opens Locating&nbsp;Legacies</p>
          <button class="overlay-close" id="inst-close">&times;</button>
        </div>
        <div class="overlay-search-wrap">
          <input id="inst-search" class="overlay-search" type="search" placeholder="Filter institutions&hellip;" autocomplete="off" />
        </div>
        <div id="inst-list" class="inst-list"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
